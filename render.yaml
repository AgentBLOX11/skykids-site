services:
  - name: skykids-site
    plan: free
    region: frankfurt
    repo: git@github.com:AgentBLOX11/skykids-site.git
    branch: main
    runtime: node
    buildCommand: cd backend && npm install && npm rebuild better-sqlite3
    startCommand: cd backend && node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: skykids2026production
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        value: ""  # MUST BE SET via Render secret groups before deploy!
