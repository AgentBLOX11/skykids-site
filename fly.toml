app = "skykids-site"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  image = "node:22-alpine"

[env]
  PORT = "3000"

[deploy]
  release_command = "echo ready"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
